[package]
name = "ascii-tcp"
version = "0.1.0"
edition = "2021"
description = "Tokio-based ASCII request/response client and server over TCP"
license = "MIT OR Apache-2.0"

[dependencies]
tokio = { version = "1", features = ["net", "io-util", "time", "rt", "sync", "macros"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
